CONSTANTS
    Object  = {o, p}
    Task    = {t}
    Session = {s, r}
    NULL = ""
    MaxRetries = 0
    DirectedGraphOf   <- MCDirectedGraphOf
    DirectedSubgraph  <- MCDirectedSubgraph
    HasDirectedCycle  <- MCHasDirectedCycle
    SimplePath        <- MCSimplePath
    IsDenumerableSet  <- IsFiniteSet

SPECIFICATION
    MCSpec

INVARIANTS
    TypeOk
    GraphStateIntegrity
    SessionMembershipConsistency
    ClosedSessionQuiescent
    PurgedSessionObjectsPurged
    DeletedSessionContentsDeleted
    DeletionWellFormed

PROPERTIES
    SessionPermanentDeletion
    PausedSessionEventualResolution
    RefineSessionProcessing1
    RefineTaskProcessing4
    MCRefineObjectProcessing4
    MCRefineGraphProcessing3
    \* The *full* RefineObjectProcessing4 and RefineGraphProcessing3 (with the
    \* target-finalization fairness) are NOT checkable here: object production is
    \* gated, through task assignment, on the owning session being OPENED, so the
    \* unconditional target-liveness those specs own is legitimately starved (the
    \* same gap that leaves RefineObjectProcessing2 commented out in
    \* GraphProcessing2_mc and RefineGraphProcessing2 in GraphProcessing3_mc). The
    \* STEP refinements MCRefineObjectProcessing4 / MCRefineGraphProcessing3 above
    \* check the safety content; the liveness rests on the Spec assumptions.

ACTION_CONSTRAINT
    ActionConstraint
