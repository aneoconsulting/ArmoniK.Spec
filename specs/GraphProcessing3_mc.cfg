CONSTANTS
    Object = {o, p}
    Task   = {t, u}
    NULL = ""
    MaxRetries = 1
    DirectedGraphOf   <- MCDirectedGraphOf
    DirectedSubgraph  <- MCDirectedSubgraph
    HasDirectedCycle  <- MCHasDirectedCycle
    SimplePath        <- MCSimplePath
    IsDenumerableSet  <- IsFiniteSet
    PermanentStopping <- MCPermanentStopping

SPECIFICATION
    MCSpec

INVARIANTS
    TypeOk
    GraphStateIntegrity
    RetryDataDependenciesValidity
    CompletedObjectHasDerivation
    DerivableObjectRegistered
    TaskStateIntegrity

PROPERTIES
    PermanentStopping
    RequestedStoppingEventualAcknowledgment
    PausedTaskEventualResolution
    RefineTaskProcessing3
    \* TargetedObjectEventualFinalization and RefineGraphProcessing2 depend on the
    \* StrandedTargetEventuallyRederivable / OpenUpstreamEventuallyClosed assumptions
    \* of the full Spec. TLC cannot carry those (their [](.. => <>[][A]_vars) shape is
    \* not a WF/SF fairness), so MCSpec drops them -- exactly as GraphProcessing2_mc
    \* drops OpenUpstreamEventuallyClosed -- and they are left for proof.
    \*
    \* Under the STOPPED->DISCARDED collapse the STEP refinement holds: every
    \* GraphProcessing3 transition is a GraphProcessing2 transition. What remains is
    \* a fairness gap -- GraphProcessing2 unconditionally finalizes every dead task
    \* and object (WF on AbortTasks/AbortObjects), whereas additive stopping parks a
    \* stopped task and its stranded outputs permanently. StrandedTargetEventually-
    \* Rederivable restores the liveness of TARGETED objects; non-targeted dead
    \* objects remain the open gap. Uncomment to reproduce the (liveness) trace:
    \* MCRefineGraphProcessing2

ACTION_CONSTRAINT
    ActionConstraint
