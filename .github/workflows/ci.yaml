name: CI

# One `verify` job runs per module of specs/ and lib/; the module's kind, as
# scripts/naming.py defines it, decides which checks it runs:
# SANY for every module, property coverage for the specifications, TLC and its
# state-space statistics for a module with a .cfg, interface consistency for a
# theorem interface. The `proofs` jobs run tlapm over the ranges that
# scripts/chunk_proofs.py plans, and `proofs-optimized` checks the modules it
# splits whole with the optimized tlapm build. The `pairing` job checks that
# interfaces, proofs and configs come in pairs, and `tests` tests the scripts/
# checkers. The TLA+ tools run through the Makefile's single-module targets, as
# they do locally.
#
# The `tools` job alone installs the toolchain and saves it to the cache; the
# other jobs only restore it.

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository.
permissions:
  contents: read

# Named explicitly, bash runs with -e and pipefail.
defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover specifications
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.list.outputs.specs }}
      chunks: ${{ steps.proofs.outputs.chunks }}
      split: ${{ steps.proofs.outputs.split }}
    steps:
      - uses: actions/checkout@v5

      # A name that cannot be a TLA+ module never reaches a shell downstream.
      - id: list
        name: List the modules of specs/ and lib/
        run: |
          specs=$(basename -s .tla specs/*.tla lib/*.tla \
            | grep -v '_TTrace_' | grep -xE '[A-Za-z][A-Za-z0-9_]*' \
            | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "specs=$specs" | tee -a "$GITHUB_OUTPUT"

      # The ranges of every proof module, and the modules split into several.
      - id: proofs
        name: Plan the proof checks
        run: |
          plan=$(python3 -m scripts.chunk_proofs --json)
          echo "chunks=$(jq -c .chunks <<<"$plan")" | tee -a "$GITHUB_OUTPUT"
          echo "split=$(jq -c .split <<<"$plan")" | tee -a "$GITHUB_OUTPUT"

  # Every run installs the tools afresh, at their latest builds, and shares them
  # with its own jobs through a cache keyed by the run (a re-run of failed jobs
  # reuses it). One install serves every job, so that they all check against
  # the same builds.
  tools:
    name: Install the TLA+ tools
    runs-on: ubuntu-latest
    outputs:
      key: tlatools-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: ./scripts/install-tools.sh

      - uses: actions/cache/save@v4
        with:
          path: .tlatools
          key: tlatools-${{ github.run_id }}

  pairing:
    name: Interface / proof pairing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Standard library only, like the commits job: no venv to build.
      - name: Check interface / proof / config pairing
        run: python3 -m scripts.check_proof_pairing specs lib

  tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `make test` builds the venv (runtime + dev pins) on demand.
      - name: Run the scripts test suite
        run: make test

  verify:
    name: ${{ matrix.spec }}
    needs: [discover, tools]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(needs.discover.outputs.specs) }}
    steps:
      - uses: actions/checkout@v5

      # scripts/naming.py is the single source of the vocabulary; restating it
      # here in shell would fail open on drift (a skipped check, a green job).
      - id: plan
        name: Classify ${{ matrix.spec }}
        env:
          SPEC: ${{ matrix.spec }}
        run: python3 -m scripts.naming "$SPEC" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/cache/restore@v4
        with:
          path: .tlatools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true

      - name: Set up Python environment
        run: make python-env

      - name: Parse (SANY)
        env:
          SPEC: ${{ matrix.spec }}
        run: make sany MODULE="$SPEC"

      - name: Check property coverage
        if: steps.plan.outputs.coverage == 'true'
        env:
          DIR: ${{ steps.plan.outputs.dir }}
          SPEC: ${{ matrix.spec }}
        run: .venv/bin/python -m scripts.check_property_coverage "$DIR/$SPEC.tla"

      # Logs TLC's output to <dir>/<module>.tlc.out for the next step.
      - name: Model-check (TLC)
        if: steps.plan.outputs.tlc == 'true'
        env:
          SPEC: ${{ matrix.spec }}
        run: make tlc MODULE="$SPEC"

      - name: Check state-space statistics
        if: steps.plan.outputs.tlc == 'true'
        env:
          DIR: ${{ steps.plan.outputs.dir }}
          SPEC: ${{ matrix.spec }}
        run: .venv/bin/python -m scripts.check_state_space "$DIR/$SPEC.cfg" "$DIR/$SPEC.tlc.out"

      - name: Check interface consistency
        if: steps.plan.outputs.interface == 'true'
        env:
          DIR: ${{ steps.plan.outputs.dir }}
          SPEC: ${{ matrix.spec }}
        run: .venv/bin/python -m scripts.check_thm_interface "$DIR/$SPEC.tla"

  # A range is named after its module alone when it is the whole file, and
  # after its position and first statement otherwise.
  proofs:
    name: "tlapm ${{ matrix.chunk.name }}"
    needs: [discover, tools]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.discover.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: .tlatools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true

      - name: Check proofs (tlapm --strict)
        env:
          MODULE: ${{ matrix.chunk.module }}
          BEGIN: ${{ matrix.chunk.begin }}
          END: ${{ matrix.chunk.end }}
        run: make tlapm MODULE="$MODULE" BEGIN="$BEGIN" END="$END"

  proofs-optimized:
    name: "tlapm-opt ${{ matrix.module }}"
    needs: [discover, tools]
    # An empty matrix is not a job GitHub can run.
    if: needs.discover.outputs.split != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.split) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache/restore@v4
        with:
          path: .tlatools
          key: ${{ needs.tools.outputs.key }}
          fail-on-cache-miss: true

      - name: Check proofs (tlapm --strict, optimized)
        env:
          MODULE: ${{ matrix.module }}
        run: make tlapm-opt MODULE="$MODULE"
